<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#147968">
    <title>掌柜智库 · 知识问答</title>
    <link rel="icon" href="/static/assets/brand.png" type="image/png">
    <link rel="stylesheet" href="/static/css/app.css">
    <!-- defer 保证 DOM 解析后按顺序执行：先加载图标、Markdown 解析和 HTML 清洗库，再初始化页面交互。 -->
    <script src="/static/vendor/lucide.min.js" defer></script>
    <script src="/static/vendor/marked.umd.js" defer></script>
    <script src="/static/vendor/purify.min.js" defer></script>
    <script src="/static/js/app.js" defer></script>
</head>
<body>
<!-- 移动端导航展开时显示遮罩，点击遮罩关闭侧栏。 -->
<button class="backdrop" id="backdrop" aria-label="关闭导航" hidden></button>

<!-- 共享侧栏：data-view 供 app.js 切换视图，href 保留对应页面的访问地址。 -->
<aside class="sidebar" id="sidebar">
    <a href="/chat.html" class="brand"><img src="/static/assets/brand.png" alt="" width="32" height="32"><span>掌柜智库<small>ZHANGGUI KNOWLEDGE</small></span></a>
    <nav aria-label="主导航">
        <a class="nav-link" href="/chat.html" data-view="chat"><i data-lucide="messages-square"></i>知识问答</a>
        <a class="nav-link" href="/import.html" data-view="import"><i data-lucide="library-big"></i>文档管理</a>
    </nav>
    <div class="sidebar-heading"><span>最近会话</span>
        <button id="new-chat" class="icon-button" title="新建会话" aria-label="新建会话"><i
                data-lucide="square-pen"></i></button>
    </div>
    <!-- 会话列表由 app.js 填充，每条会话包含打开和删除入口。 -->
    <div class="session-list" id="session-list"><p class="muted small">正在加载…</p></div>
    <div class="sidebar-footer"><span class="workspace-icon"><i data-lucide="building-2"></i></span>
        <div>我的工作空间<small>本地知识库</small></div>
        <span class="local-dot"></span></div>
</aside>

<div class="workspace">
    <!-- 顶栏展示当前视图及服务连接状态；服务明细由健康检查接口返回。 -->
    <header class="topbar">
        <button class="icon-button mobile-menu" id="menu-button" title="打开导航" aria-label="打开导航"><i
                data-lucide="menu"></i></button>
        <div class="breadcrumb">工作空间<span>/</span><strong id="view-name">知识问答</strong></div>
        <details class="service-menu">
            <summary><span class="status-dot" id="health-dot"></span><span id="health-label">连接中</span><i
                    data-lucide="chevron-down"></i></summary>
            <div class="service-dropdown">
                <div class="section-label">服务连接</div>
                <div id="service-list"></div>
                <button id="refresh-health" class="text-button"><i data-lucide="refresh-cw"></i>刷新状态</button>
            </div>
        </details>
    </header>
    <!-- 问答与文档管理共用本模板，app.js 根据路径和导航操作切换两个 main 的 hidden 状态。 -->
    <main id="chat-view" class="chat-view">
        <div class="view-toolbar">
            <div class="title-group"><span class="eyebrow">知识问答</span>
                <h1 id="chat-title">新会话</h1></div>
            <div class="toolbar-actions"><label class="switch-label"><input type="checkbox" id="stream-mode" checked
                                                                            role="switch"><span
                    class="switch-track"></span><span>流式回答</span></label>
                <button class="icon-button" id="clear-chat" title="删除当前会话" aria-label="删除当前会话"><i
                        data-lucide="trash-2"></i></button>
            </div>
        </div>
        <!-- 消息挂载区：加载历史或发送问题时替换空状态，动态插入回答、引用和图片。 -->
        <div class="messages" id="messages" aria-live="polite" aria-relevant="additions">
            <div class="chat-empty" id="chat-empty"><img src="/static/assets/brand.png" alt="" width="64" height="64">
                <h2>掌柜智库</h2>
                <p>知识问答</p>
                <div class="empty-rule"></div>
            </div>
        </div>
        <div class="composer-wrap">
            <form id="query-form" class="composer"><label class="sr-only" for="question">问题</label><textarea
                    id="question" placeholder="输入你的问题…" rows="2" maxlength="4000" required></textarea>
                <div class="composer-bottom"><span id="composer-status"><span
                        class="status-dot good"></span>新会话</span>
                    <div class="composer-buttons"><span id="char-count" class="muted small">0 / 4000</span>
                        <button type="submit" class="send-button" id="send" title="发送问题" aria-label="发送问题"><i
                                data-lucide="arrow-up"></i></button>
                    </div>
                </div>
            </form>
            <div class="composer-note"><span id="conversation-count">0 条消息</span><span>掌柜智库</span></div>
        </div>
    </main>
    <!-- 文档管理：统计当前服务保留的导入任务，支持批量选择、拖入文件和任务状态筛选。
         upload-progress 表示文件上传进度；解析、向量化等后台处理进度显示在 task-list 中。 -->
    <main id="import-view" class="import-view" hidden>
        <div class="import-heading">
            <div><span class="eyebrow">知识库</span>
                <h1>文档管理</h1></div>
            <button id="refresh-tasks" class="icon-button" title="刷新文档列表" aria-label="刷新文档列表"><i
                    data-lucide="refresh-cw"></i></button>
        </div>
        <div class="stats">
            <div><span>本次服务导入</span><strong id="stat-total">0<small>份</small></strong></div>
            <div><span><span class="status-dot good"></span>已完成</span><strong
                    id="stat-done">0<small>份</small></strong></div>
            <div><span><span class="status-dot amber"></span>处理中</span><strong
                    id="stat-running">0<small>份</small></strong></div>
        </div>
        <section class="upload-section" aria-labelledby="upload-title">
            <div class="section-heading"><h2 id="upload-title">导入文档</h2><span class="muted small">PDF / Markdown · 单文件 ≤ 50 MB</span>
            </div>
            <div id="dropzone" class="dropzone">
                <div class="upload-symbol"><i data-lucide="file-up"></i></div>
                <div class="dropzone-label">拖入文档</div>
                <button type="button" id="choose-files" class="secondary-button"><i data-lucide="folder-open"></i>选择文件
                </button>
                <input type="file" id="files" accept=".pdf,.md" multiple hidden></div>
            <div id="upload-queue"></div>
            <div id="upload-actions" class="upload-actions" hidden><span class="muted small"
                                                                         id="selection-count"></span>
                <button id="upload-button" class="primary-button"><i data-lucide="upload"></i>开始导入</button>
            </div>
            <div class="upload-meter" id="upload-meter" hidden>
                <progress id="upload-progress" max="100" value="0"></progress>
                <span id="upload-percent">0%</span></div>
        </section>
        <section class="task-section" aria-labelledby="task-title">
            <div class="section-heading"><h2 id="task-title">导入记录</h2><label class="search-box"><i
                    data-lucide="search"></i><input id="task-search" placeholder="搜索文档"
                                                    aria-label="搜索文档"></label></div>
            <div class="filter-tabs" role="tablist" aria-label="导入状态">
                <button role="tab" aria-selected="true" data-filter="all">全部</button>
                <button role="tab" aria-selected="false" data-filter="processing">处理中</button>
                <button role="tab" aria-selected="false" data-filter="completed">已完成</button>
                <button role="tab" aria-selected="false" data-filter="failed">失败</button>
            </div>
            <div class="task-table-header"><span>文档名称</span><span>状态</span><span>导入时间</span><span></span>
            </div>
            <div id="task-list"></div>
        </section>
    </main>
</div>
<!-- 全局轻提示：反馈复制、上传和删除等操作结果，由 app.js 控制显示与自动隐藏。 -->
<div class="toast" id="toast" role="status" hidden></div>
<!-- 删除确认：打开时填入目标会话名称；JS 拦截确认提交，接口成功后关闭，失败时显示 delete-error。 -->
<dialog id="confirm-dialog" aria-labelledby="delete-heading" aria-describedby="delete-description">
    <form id="delete-session-form" method="dialog">
        <div class="dialog-heading"><h2 id="delete-heading">删除这条会话？</h2>
            <button class="icon-button" value="cancel" title="关闭" aria-label="关闭删除确认"><i data-lucide="x"></i>
            </button>
        </div>
        <p id="delete-session-title"></p>
        <p id="delete-description">该会话的全部聊天记录将被永久删除，无法恢复。已导入的知识库文档不受影响。</p>
        <p id="delete-error" role="alert" hidden></p>
        <div class="dialog-actions">
            <button class="secondary-button" value="cancel" autofocus>取消</button>
            <button id="confirm-delete" class="danger-button" value="confirm">删除会话</button>
        </div>
    </form>
</dialog>
<!-- 图片预览复用同一弹窗，点击回答中的图片时更新 preview-image 的 src。 -->
<dialog id="image-dialog">
    <button id="close-image" class="icon-button" aria-label="关闭图片" title="关闭图片"><i data-lucide="x"></i></button>
    <img id="preview-image" alt="文档图片预览"></dialog>
<!-- 引用详情：按当前消息的来源编号填充摘录；桌面显示侧栏，手机显示底部面板，无原文地址时隐藏链接。 -->
<dialog id="source-dialog" aria-labelledby="source-title">
    <div class="dialog-heading"><h2 id="source-title">资料依据</h2>
        <button id="close-source" class="icon-button" aria-label="关闭依据" title="关闭依据"><i data-lucide="x"></i>
        </button>
    </div>
    <div class="source-meta"><span id="source-kind"></span><a id="source-link" target="_blank" rel="noopener noreferrer"
                                                              hidden>打开原文 <i data-lucide="external-link"></i></a>
    </div>
    <div id="source-excerpt" class="message-body" tabindex="0"></div>
</dialog>
</body>
</html>
